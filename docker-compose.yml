services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: futsal_backend
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - postgres
      - redis
    networks:
      - futsal_network

  nginx:
    image: nginx:alpine
    container_name: futsal_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - futsal_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: futsal_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - API_URL=http://nginx/api
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_REVERB_APP_KEY=byjyep7vrbcf0yllbm5o
      - NEXT_PUBLIC_REVERB_HOST=localhost
      - NEXT_PUBLIC_REVERB_PORT=8080
    depends_on:
      - nginx
    networks:
      - futsal_network

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: futsal_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - futsal_network

  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: futsal_queue_worker
    command: php artisan queue:work --tries=3
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend
      - redis
    networks:
      - futsal_network

  postgres:
    image: postgres:15-alpine
    container_name: futsal_postgres
    environment:
      POSTGRES_DB: futsal_db
      POSTGRES_USER: futsal_user
      POSTGRES_PASSWORD: futsal_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - futsal_network

  redis:
    image: redis:7-alpine
    container_name: futsal_redis
    ports:
      - "6379:6379"
    networks:
      - futsal_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: futsal_mailpit
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - futsal_network

networks:
  futsal_network:
    driver: bridge

volumes:
  postgres_data:
